services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: moneyplease
      POSTGRES_PASSWORD: moneyplease
      POSTGRES_DB: moneyplease
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyplease"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://moneyplease:moneyplease@db:5432/moneyplease
    volumes:
      - ./backend/secrets:/app/secrets:ro
      - ./backend/private:/app/private
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m moneyplease worker"

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://moneyplease:moneyplease@db:5432/moneyplease
      DEMO_DATABASE_URL: postgresql+psycopg://moneyplease:moneyplease@db:5432/moneyplease_demo
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/private:/app/private
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn moneyplease.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  hf_cache:
