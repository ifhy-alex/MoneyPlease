services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: moneyplease
      POSTGRES_PASSWORD: moneyplease
      POSTGRES_DB: moneyplease
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyplease"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://moneyplease:moneyplease@db:5432/moneyplease
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m moneyplease worker"

volumes:
  pgdata:
